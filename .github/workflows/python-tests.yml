name: Python Tests

on:
  push:
    paths:
      - "kwikledgers_langgraph/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/bootstrap.sh"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "kwikledgers_langgraph/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/bootstrap.sh"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

env:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  POETRY_VERSION: "2.4.1"
  POETRY_VIRTUALENVS_CREATE: "true"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"
  FASTMCP_REVISION: ${{ vars.FASTMCP_REVISION }}
  KWIKLEDGERS_FASTMCP_TRANSPORT: stdio
  KWIKLEDGERS_FASTMCP_COMMAND: ${{ github.workspace }}/kwikledgers_fastmcp/.venv/bin/python

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: kwikledgers_langgraph
    steps:
      - name: Checkout LangGraph
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: kwikledgers_langgraph
          persist-credentials: false

      - name: Require explicit private sibling revision
        env:
          FASTMCP_REPOSITORY_TOKEN: ${{ secrets.FASTMCP_REPOSITORY_TOKEN }}
        run: |
          if [[ ! "$FASTMCP_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'Configure FASTMCP_REVISION with the published compatible FastMCP commit SHA.\n' >&2
            exit 1
          fi
          if [[ -z "$FASTMCP_REPOSITORY_TOKEN" ]]; then
            printf 'Configure FASTMCP_REPOSITORY_TOKEN for read-only private sibling access.\n' >&2
            exit 1
          fi

      - name: Checkout standalone FastMCP sibling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: marcosambra/kwikledgers_fastmcp
          ref: ${{ env.FASTMCP_REVISION }}
          path: kwikledgers_fastmcp
          token: ${{ secrets.FASTMCP_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Setup independent FastMCP Python
        id: fastmcp-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup LangGraph Python
        id: langgraph-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Validate bootstrap syntax and help
        run: |
          bash -n scripts/bootstrap.sh
          bash scripts/bootstrap.sh --help
          bash -n ../kwikledgers_fastmcp/scripts/bootstrap.sh
          bash ../kwikledgers_fastmcp/scripts/bootstrap.sh --help

      - name: Validate dependency locks
        run: |
          poetry check --lock
          poetry -C ../kwikledgers_fastmcp check --lock

      - name: Install isolated locked runtimes
        run: |
          bash ../kwikledgers_fastmcp/scripts/bootstrap.sh "${{ steps.fastmcp-python.outputs.python-path }}"
          bash scripts/bootstrap.sh "${{ steps.langgraph-python.outputs.python-path }}"

      - name: Verify existing virtualenvs are preserved
        run: |
          fastmcp_python="$(poetry -C ../kwikledgers_fastmcp env info --executable)"
          langgraph_python="$(poetry env info --executable)"
          bash ../kwikledgers_fastmcp/scripts/bootstrap.sh
          bash scripts/bootstrap.sh
          test "$fastmcp_python" = "$(poetry -C ../kwikledgers_fastmcp env info --executable)"
          test "$langgraph_python" = "$(poetry env info --executable)"
          poetry -C ../kwikledgers_fastmcp run python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          poetry run python -c 'import sys; assert sys.version_info[:2] == tuple(map(int, "${{ matrix.python-version }}".split(".")))'

      - name: Validate dependency consistency
        run: |
          poetry run python -m pip check
          poetry -C ../kwikledgers_fastmcp run python -m pip check
          poetry -C ../kwikledgers_fastmcp run python -c 'from importlib.metadata import version; from kwikledgers_fastmcp.server import build_fastmcp_server; build_fastmcp_server(); print("fastmcp=" + version("fastmcp"))'

      - name: Validate MCP SDK runtime imports
        run: |
          poetry run python -c 'from importlib.metadata import version; from mcp import ClientSession, StdioServerParameters; from mcp.client.stdio import stdio_client; from mcp.client.streamable_http import streamablehttp_client; from kwikledgers_langgraph.fastmcp_client import FastMCPClient; sdk_version = version("mcp"); assert sdk_version.split(".")[0] == "1", sdk_version; print("mcp=" + sdk_version)'

      - name: Validate independent stdio transport
        run: |
          poetry run python - <<'PY'
          import asyncio
          import sys
          from importlib.util import find_spec
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          from kwikledgers_langgraph.fastmcp_client import FastMCPClientConfig

          async def check_transport():
              config = FastMCPClientConfig.from_environment()
              assert config.transport == "stdio"
              assert Path(config.command).is_file(), config.command
              assert Path(config.command).parent != Path(sys.executable).parent
              assert find_spec("fastmcp") is None
              parameters = StdioServerParameters(command=config.command, args=list(config.args))
              async with stdio_client(parameters) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      catalog = await session.list_tools()
                      assert catalog.tools, "FastMCP tool catalog is empty"
                      print("stdio handshake and tool catalog validated")

          asyncio.run(asyncio.wait_for(check_transport(), timeout=30))
          PY

      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -v

      - name: Validate daily summary CLI
        run: poetry run kwikledgers-langgraph --help

      - name: Validate story PR CLI
        run: poetry run kwikledgers-langgraph-story-pr --help

      - name: Validate story branch CLI
        run: poetry run kwikledgers-langgraph-story-branch --help

      - name: Validate story status CLI
        run: poetry run kwikledgers-langgraph-story-status --help

      - name: Validate task closure CLI
        run: poetry run kwikledgers-langgraph-task-closure --help

      - name: Validate sprint stories CLI
        run: poetry run kwikledgers-langgraph-sprint-stories --help

      - name: Validate lifecycle CLI
        run: poetry run kwikledgers-langgraph-lifecycle --help

      - name: Validate atomic CLI
        run: poetry run kwikledgers-langgraph-atomic --help