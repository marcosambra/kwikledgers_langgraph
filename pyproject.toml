[project]
name = "kwikledgers-langgraph"
version = "0.1.0"
description = "Parallel LangGraph runtime scaffold for KwikLedgers orchestration."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "KwikLedgers", email = "dev@kwikledgers.com" }
]
dependencies = [
    "langchain-core>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "pydantic>=2.8,<3.0",
    "typing-extensions>=4.12,<5.0"
]

[project.scripts]
kwikledgers-langgraph = "kwikledgers_langgraph.cli:main"
kwikledgers-langgraph-story-pr = "kwikledgers_langgraph.story_pr_cli:main"
kwikledgers-langgraph-story-branch = "kwikledgers_langgraph.story_branch_cli:main"
kwikledgers-langgraph-story-status = "kwikledgers_langgraph.story_status_cli:main"

[tool.poetry]
packages = [{ include = "kwikledgers_langgraph", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"